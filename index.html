<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>동물의GYM 동작 검토</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a review desk. Characters and their versions on the left, the stage in the middle (motion or app
   screen), the version's report on the right; columns stack on narrow screens. */
:root {
  --bg: #f4ede2; --panel: #fffaf2; --ink: #3b2a20; --muted: #85705f; --line: #e5d9c7;
  --accent: #e8352a; --accent-ink: #ffffff; --chip: #f1e5d3;
  --ok: #4f7f2a; --ok-bg: #e5efd7; --warn: #a2620d; --warn-bg: #f8e6c6; --old: #7d6f63; --old-bg: #ece4d8;
  --stage-a: #fdf6ea; --stage-b: #efdfc6;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1814; --panel: #28211c; --ink: #f2e6d5; --muted: #b09b86; --line: #3c3129; --accent: #ff5a4c; --accent-ink: #1d1814; --chip: #342a23;
  --ok: #a6d27a; --ok-bg: #2c3a22; --warn: #f0b867; --warn-bg: #3d2f1a; --old: #b9aa9b; --old-bg: #332b25; --stage-a: #3a2f27; --stage-b: #221c17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1d1814; --panel: #28211c; --ink: #f2e6d5; --muted: #b09b86; --line: #3c3129; --accent: #ff5a4c; --accent-ink: #1d1814; --chip: #342a23;
  --ok: #a6d27a; --ok-bg: #2c3a22; --warn: #f0b867; --warn-bg: #3d2f1a; --old: #b9aa9b; --old-bg: #332b25; --stage-a: #3a2f27; --stage-b: #221c17; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); }

.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; }
.top h1 { font-size: clamp(24px, 3.2vw, 32px); line-height: 1.15; }
.tabs { display: inline-flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 14px; }
.tabs button { border-radius: 10px; background: transparent; }
.tabs button[aria-selected="true"] { background: var(--panel); box-shadow: 0 1px 0 var(--line); font-weight: 600; }

.grid { display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 380px); gap: 16px; align-items: start; }
@media (max-width: 1180px) { .grid { grid-template-columns: 210px minmax(0, 1fr); } #report { grid-column: 1 / -1; } }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }

button, select { font: inherit; font-size: 14px; color: var(--ink); background: var(--chip); border: 1px solid transparent; border-radius: 12px; padding: 7px 11px; cursor: pointer; }
button:hover { border-color: var(--line); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { padding-right: 28px; }

/* sidebar */
#chars { display: grid; gap: 10px; align-content: start; }
.char { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: grid; gap: 6px; }
.char-head { display: flex; gap: 10px; align-items: center; text-align: left; background: transparent; padding: 4px; width: 100%; }
.char-head[aria-pressed="true"] { background: transparent; color: var(--ink); }
.char-head img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; object-position: 50% 25%; background: var(--chip); }
.char-head b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; }
.char-head small { color: var(--muted); }
.vers { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ver { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 0 8px; text-align: left; background: transparent; padding: 7px 9px; }
.ver.on, .ver[aria-pressed="true"] { background: var(--chip); color: var(--ink); border-color: var(--line); }
.vid { font-family: var(--mono); font-size: 14px; }
.vdate { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.ver .chip { grid-column: 1 / -1; justify-self: start; margin-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--old-bg); color: var(--old); }
.chip.review { background: var(--warn-bg); color: var(--warn); }
.chip.approved { background: var(--ok-bg); color: var(--ok); }
.chip.base { background: var(--chip); color: var(--ink); }

/* stage */
.main { display: grid; gap: 12px; min-width: 0; }
.stagewrap { position: relative; }
#stage { position: relative; height: min(68vh, 640px); min-height: 380px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 18%, var(--stage-a), var(--stage-b)); }
#stage canvas, #phoneStage canvas { width: 100%; height: 100%; display: block; touch-action: none; }
#stage canvas { cursor: grab; }
.hint { position: absolute; left: 14px; top: 12px; font-size: 12px; color: var(--muted); pointer-events: none; }
.read { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; pointer-events: none; font-variant-numeric: tabular-nums; font-size: 12px; }
.read span, .lab { background: var(--panel); border: 1px solid var(--line); padding: 2px 9px; border-radius: 999px; }
#labels { position: absolute; inset: auto 0 52px 0; display: flex; justify-content: space-around; pointer-events: none; font-size: 12px; }
#status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.clip { display: grid; text-align: left; padding: 7px 11px; }
.clip small { font-size: 11px; opacity: .8; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 5px; background: var(--bg); }
.lbl { font-size: 12px; color: var(--muted); min-width: 34px; }

/* app preview */
#appPane { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { #appPane { grid-template-columns: minmax(0, 1fr); justify-items: center; } }
.phone { position: relative; width: 320px; aspect-ratio: 9 / 19.5; border-radius: 42px; padding: 10px; background: #1b1512; box-shadow: 0 18px 40px rgba(40, 24, 10, .25); max-width: 100%; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 33px; overflow: hidden; background: #f6ecdc center / cover no-repeat; color: #3b2a20; }
.screen .sb { position: absolute; top: 10px; left: 22px; right: 22px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; z-index: 2; }
#phoneStage { position: absolute; inset: 21% 0 34% 0; }
#bubble { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 16px; padding: 7px 13px; font-weight: 600; font-size: 13px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 2; }
#bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: #fff; transform: translateX(-50%) rotate(45deg); }
#appName { position: absolute; top: 64%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 24px; z-index: 2; }
#appSteps { position: absolute; left: 14px; right: 14px; bottom: 76px; margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; z-index: 2; }
#appSteps li { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.88); border-radius: 14px; padding: 9px 12px; font-size: 13px; font-weight: 500; }
#appSteps li i { width: 10px; height: 10px; border-radius: 50%; background: #c9b7a3; flex: none; }
#appSteps li.done i { background: #e8352a; } #appSteps li.now { background: #fff; outline: 2px solid #e8352a; } #appSteps li.locked { opacity: .6; }
#appSteps em { margin-left: auto; font-style: normal; font-size: 11px; background: #f7c948; border-radius: 999px; padding: 1px 8px; }
.cta { position: absolute; left: 14px; right: 14px; bottom: 18px; border-radius: 16px; padding: 13px; background: #3b2a20; color: #fff; text-align: center; font-weight: 600; z-index: 2; }
.appside { display: grid; gap: 12px; min-width: 0; }

/* report */
#report { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.rhead { display: grid; gap: 4px; justify-items: start; }
.rhead h2 { font-size: 22px; line-height: 1.2; }
.summary { margin: 0; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
.stats dt { color: var(--muted); } .stats dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rsec { display: grid; gap: 6px; }
.rsec h3 { font-size: 16px; }
.rsec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.rsec.warn li::marker { color: var(--warn); } .rsec.ask li::marker { color: var(--accent); }
figure { margin: 0; display: grid; gap: 4px; }
figure img { border-radius: 10px; border: 1px solid var(--line); width: 100%; height: auto; display: block; }
figcaption { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">모여봐요 동물의GYM · 캐릭터 동작 검토</div>
      <h1>동물의GYM 동작 검토</h1>
      <div class="muted small" id="crumb"></div>
    </div>
    <div class="tabs" role="tablist" aria-label="보기">
      <button role="tab" data-tab="motion" aria-selected="true">동작 검토</button>
      <button role="tab" data-tab="app" aria-selected="false">앱 화면</button>
    </div>
  </div>

  <div class="grid">
    <nav id="chars" aria-label="캐릭터와 버전"></nav>

    <div class="main">
      <div id="motionPane" class="main">
        <div class="stagewrap">
          <div id="stage">
            <div class="hint">드래그로 돌려보기 · 캐릭터를 누르면 인사해요</div>
            <div id="labels"></div>
            <div class="read"><span id="time">—</span><span id="frame">—</span></div>
            <div id="status">모델을 불러오는 중…</div>
          </div>
        </div>
        <div class="panel">
          <div class="bar" id="clips"></div>
          <div class="bar">
            <button id="playBtn">일시정지</button>
            <button data-speed="0.5">0.5×</button><button data-speed="1">1×</button><button data-speed="1.5">1.5×</button>
            <label class="check"><input type="checkbox" id="autoReturn" checked> 동작 후 대기로</label>
          </div>
          <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="재생 위치">
          <div class="bar">
            <span class="lbl">시점</span>
            <button data-view="front">정면</button><button data-view="three">3/4</button><button data-view="side">옆</button><button data-view="back">뒤</button><button data-view="below">아래</button>
            <label class="check"><input type="checkbox" id="skelBtn"> 뼈대</label>
          </div>
          <div class="bar" id="compareRow">
            <label class="lbl" for="compare">비교</label>
            <select id="compare"></select>
            <span class="muted small"><kbd>,</kbd> <kbd>.</kbd> 프레임 이동 · <kbd>Space</kbd> 재생/정지</span>
          </div>
        </div>
      </div>

      <div id="appPane" hidden>
        <div class="phone">
          <div class="screen" id="screen">
            <div class="sb"><span>9:41</span><span>●●● 5G</span></div>
            <div id="bubble"></div>
            <div id="phoneStage"></div>
            <div id="appName"></div>
            <ol id="appSteps"></ol>
            <div class="cta">운동 시작</div>
          </div>
        </div>
        <div class="appside">
          <div class="panel">
            <h3>앱 상태</h3>
            <div class="bar" id="appStates"></div>
            <div class="muted small" id="appNote"></div>
          </div>
          <div class="panel">
            <h3>이 화면에 대해</h3>
            <p class="small" style="margin:0" id="appStatus"></p>
            <p class="small muted" style="margin:0">방 화면 구성(말풍선·이름·오늘의 단계·운동 시작)은 기획의 첫 흐름을 옮긴 시안이에요. 응원·성취 동작이 생기면 운동 중·완료 상태에서 바로 재생돼요.</p>
          </div>
        </div>
      </div>
    </div>

    <aside id="report" aria-label="버전 보고서"></aside>
  </div>
